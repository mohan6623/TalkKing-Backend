; ============================================================
; Supervisor Configuration — TalkKing Backend Services
; Place this file in: /etc/supervisor/conf.d/talkking.conf
; After changes: supervisorctl reread && supervisorctl update
; ============================================================

; ── FastAPI / Uvicorn ────────────────────────────────────────
[program:talkking-api]
command=/home/deploy/talkking/venv/bin/uvicorn app.main:app
        --host 127.0.0.1
        --port 8000
        --workers 4
        --loop uvloop
        --access-log
        --log-level info
directory=/home/deploy/talkking/Backend
user=deploy
autostart=true
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
killasgroup=true

; Environment variables (production)
environment=ENVIRONMENT="production",
            PYTHONPATH="/home/deploy/talkking/Backend"

; Logging
stdout_logfile=/var/log/talkking/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/talkking/api_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ── Celery Worker — analysis tasks ──────────────────────────
[program:talkking-celery-worker]
command=/home/deploy/talkking/venv/bin/celery
        --app app.tasks.celery_app.celery_app
        worker
        --loglevel=info
        --concurrency=4
        --queues=analysis
        --hostname=worker@%%h
        --max-tasks-per-child=50
directory=/home/deploy/talkking/Backend
user=deploy
autostart=true
autorestart=true
startsecs=10
startretries=3
stopwaitsecs=60
stopasgroup=true
killasgroup=true

environment=ENVIRONMENT="production",
            PYTHONPATH="/home/deploy/talkking/Backend"

stdout_logfile=/var/log/talkking/celery_worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/talkking/celery_worker_error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

; ── Celery Beat — scheduled tasks (future use) ───────────────
[program:talkking-celery-beat]
command=/home/deploy/talkking/venv/bin/celery
        --app app.tasks.celery_app.celery_app
        beat
        --loglevel=info
        --scheduler celery.beat:PersistentScheduler
        --schedule=/var/lib/talkking/celerybeat-schedule
directory=/home/deploy/talkking/Backend
user=deploy
autostart=false
autorestart=true
startsecs=10

environment=ENVIRONMENT="production",
            PYTHONPATH="/home/deploy/talkking/Backend"

stdout_logfile=/var/log/talkking/celery_beat.log
stdout_logfile_maxbytes=10MB
stderr_logfile=/var/log/talkking/celery_beat_error.log
stderr_logfile_maxbytes=5MB

; ── Process Group — control all services together ────────────
[group:talkking]
programs=talkking-api,talkking-celery-worker,talkking-celery-beat
priority=999
