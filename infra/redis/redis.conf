# ============================================================
# Redis Configuration — TalkKing Production
# ============================================================

# ── Network ─────────────────────────────────────────────────
bind 127.0.0.1
port 6379
protected-mode yes

# ── Authentication ───────────────────────────────────────────
# Set a strong password in production
# requirepass your_redis_password_here

# ── Memory ──────────────────────────────────────────────────
maxmemory 512mb
maxmemory-policy allkeys-lru

# ── Persistence ─────────────────────────────────────────────
# RDB snapshots (for Celery result backend)
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/redis

# Disable AOF for Celery use case (speed over persistence)
appendonly no

# ── Performance ─────────────────────────────────────────────
tcp-backlog 511
timeout 300
tcp-keepalive 60
hz 10
dynamic-hz yes

# ── Logging ─────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis-server.log

# ── Celery-specific tunning ──────────────────────────────────
# Disable slow log for production
slowlog-log-slower-than 10000
slowlog-max-len 128

# ── Connection limits ────────────────────────────────────────
maxclients 100
